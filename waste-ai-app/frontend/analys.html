<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BinWise - Analys</title>
  <link rel="icon" type="image/png" href="/reference-images/binwise_white.png" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-wrap">
      <div class="nav-shell">
        <nav class="nav-links">
          <a class="nav-link" href="/hem">Hem</a>
          <a class="nav-link active" href="/analys">Analys</a>
          <a class="nav-link" href="/om-oss">Om oss</a>
        </nav>
      </div>

      <a href="/hem" class="brand-anchor" aria-label="BinWise">
        <img src="/reference-images/binwise_white.png" alt="BinWise" class="brand-logo">
      </a>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="wrap">
        <div class="glass-card hero-card">
          <h3 class="section-card-title">Analysera bild</h3>
          <div class="row">
            <label class="upload-btn">
              <i class="fa-regular fa-image"></i>
              <span>Ladda upp bild</span>
              <input id="file" type="file" accept="image/*">
            </label>
            <span id="status" class="muted"></span>
          </div>
        </div>

        <div class="glass-card">
          <h3 class="section-card-title">Förhandsvisning</h3>
          <div class="preview-frame">
            <img id="preview" alt="preview" style="display:none;" />
            <div id="noPreview" class="muted">Ingen bild vald ännu.</div>
          </div>
        </div>

        <div class="glass-card">
          <h3 class="section-card-title">Resultat</h3>
          <div id="result" class="muted">Efter analys visas resultatet här.</div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div>
        <div class="footer-brand-wrap">
          <img src="/reference-images/binwise_white.png" alt="BinWise" class="footer-logo">
          <div class="footer-brand">BinWise</div>
        </div>
        <div class="footer-text">Smartare sortering för Återvinningscentralen
           <br>  <br>
            E-Post: Arminhaghighat7@gmail.com
        </div>
      </div>

      <div class="footer-links">
        <a href="/hem">Hem</a>
        <a href="/analys">Analys</a>
        <a href="/om-oss">Om oss</a>
      </div>
    </div>
  </footer>

  <script>
    const fileInput = document.getElementById("file");
    const preview = document.getElementById("preview");
    const noPreview = document.getElementById("noPreview");
    const statusEl = document.getElementById("status");
    const resultEl = document.getElementById("result");

    let selectedFile = null;

    function setPreview(file) {
      if (!file) {
        preview.style.display = "none";
        noPreview.style.display = "block";
        return;
      }

      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.style.display = "block";
      noPreview.style.display = "none";
    }

    function resetBeforeAnalyze() {
      statusEl.textContent = "";
      resultEl.textContent = "Efter analys visas resultatet här.";
    }

    async function analyzeSelectedFile() {
      if (!selectedFile) return;

      statusEl.textContent = "Analyserar...";

      try {
        const form = new FormData();
        form.append("file", selectedFile);

        const res = await fetch("/analyze", {
          method: "POST",
          body: form
        });

        const data = await res.json();
        renderApiResponse(data);

        statusEl.textContent = "Klar";
      } catch (err) {
        statusEl.textContent = "Fel vid anslutning";
        resultEl.textContent = "Fel.";
      }
    }

    fileInput.addEventListener("change", async () => {
      const f = fileInput.files?.[0];
      selectedFile = f || null;

      resetBeforeAnalyze();
      setPreview(selectedFile);

      if (selectedFile) {
        await analyzeSelectedFile();
      }
    });

    document.addEventListener("paste", async (event) => {
      const items = event.clipboardData?.items;
      if (!items) return;

      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const blob = item.getAsFile();
          if (!blob) continue;

          const ext = blob.type.split("/")[1] || "png";
          selectedFile = new File([blob], `pasted-image.${ext}`, { type: blob.type });

          resetBeforeAnalyze();
          setPreview(selectedFile);
          await analyzeSelectedFile();
          break;
        }
      }
    });

    function renderPrimaryPrediction(predictions, backendNote, referenceImage) {
      if (!predictions || !predictions.length) {
        return `<div class="muted">Inget resultat.</div>`;
      }

      const first = predictions[0];
      const second = predictions.length > 1 ? predictions[1] : null;

      const secondBox = second
        ? `
          <div class="tip-box warning-box">
            <div class="tip-icon warning">
              <i class="fa-solid fa-lightbulb"></i>
            </div>
            <div class="tip-text">
              Det kan även vara <b>${second.label}</b>, men sannolikheten är lägre. För säkerhets skull kan du dubbelkolla med personal.
            </div>
          </div>
        `
        : "";

      const reuseBox = backendNote
        ? `
          <div class="tip-box success-box">
            <div class="tip-icon success">
              <i class="fa-solid fa-recycle"></i>
            </div>
            <div class="tip-text">${backendNote}</div>
          </div>
        `
        : "";

      const referenceBox = referenceImage
        ? `
          <div class="reference-image-box">
            <div class="reference-image-frame">
              <img src="${referenceImage}" alt="${first.label}">
            </div>
          </div>
        `
        : "";

      return `
        <div class="result-box">
          <div class="option-card">
            <div class="primary-result">${first.label}</div>
            <div class="primary-sub">Mest sannolika kategori</div>
            ${referenceBox}
          </div>
          ${secondBox}
          ${reuseBox}
        </div>
      `;
    }

    function renderApiResponse(data) {
      if (data.status === "no_guess") {
        const tips = (data.tips || []).map(t => `<span class="pill">${t}</span>`).join("");
        resultEl.innerHTML = `
          <div class="result-box">
            <div class="error-row">
              <i class="fa-solid fa-circle-xmark"></i>
              <b>${data.message || "Jag kan inte avgöra vad det är."}</b>
            </div>
            <div style="margin-top:10px;">${tips}</div>
          </div>
        `;
        return;
      }

      if (data.status === "ok" && data.predictions) {
        resultEl.innerHTML = renderPrimaryPrediction(
          data.predictions,
          data.note,
          data.reference_image
        );
        return;
      }

      resultEl.textContent = "Inget resultat.";
    }
  </script>
</body>
</html>
